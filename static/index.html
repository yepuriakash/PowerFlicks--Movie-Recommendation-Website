<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PowerFlicks — discover movies, explore cast and details, save your watchlist, and share reviews.">
  <meta name="theme-color" content="#070b15">
  <title>PowerFlicks — Movie Discovery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <!-- ========================= HEADER ========================= -->
  <header>
    <a href="#" class="brand" id="explore" aria-label="PowerFlicks home">
      Power<span>Flicks</span>
    </a>

    <nav aria-label="Movie categories">
      <button type="button" data-list="popular" class="selected">Popular</button>
      <button type="button" data-list="top_rated">Top Rated</button>
      <button type="button" data-list="now_playing">Now Playing</button>
      <button type="button" data-list="upcoming">Upcoming</button>
      <button type="button" id="watchlist-button">
        My List <b id="watchlist-count">0</b>
      </button>
    </nav>

    <label class="search" aria-label="Search movies">
      <span aria-hidden="true">⌕</span>
      <input
        id="search"
        type="search"
        autocomplete="off"
        placeholder="Search movies..."
        aria-label="Search movies"
      >
    </label>
  </header>

  <!-- ========================= MAIN ========================= -->
  <main>
    <!-- Hero -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-text">
        <p class="eyebrow">PowerFlicks · MOVIE DISCOVERY</p>
        <h1 id="hero-title">Find your next movie.</h1>
        <p>
          Browse popular, top-rated, currently playing and upcoming films.
          Search for a movie to explore its poster, backdrop, cast, genres,
          runtime, reviews and recommendations.
        </p>
        <button type="button" class="primary" onclick="document.querySelector('#search').focus()">
          Search Movies
        </button>
      </div>
    </section>

    <!-- Movie section -->
    <section aria-labelledby="heading">
      <div class="toolbar">
        <div>
          <h2 id="heading">Popular movies</h2>
          <p id="status" aria-live="polite">Loading movies…</p>
        </div>
      </div>

      <div id="movies" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- ========================= MOVIE CARD TEMPLATE ========================= -->
  <template id="card-template">
    <article class="card">
      <button type="button" class="poster" aria-label="View movie details">
        <img src="" alt="" loading="lazy">
        <span class="score">★ 0.0</span>
      </button>

      <div class="card-copy">
        <h3></h3>
        <p></p>
        <button type="button" class="save">+ My List</button>
      </div>
    </article>
  </template>

  <!-- ========================= MOVIE DETAILS MODAL ========================= -->
  <dialog id="modal" aria-labelledby="modal-content">
    <button type="button" class="close" aria-label="Close movie details">×</button>
    <div id="modal-content">
      <p class="empty">Loading…</p>
    </div>
  </dialog>

  <!--
    app.js is the application layer.
    It talks to app.py, which talks to TMDB and SQLite.
    The TMDB token is therefore never exposed in this HTML file.
  -->
  <script src="/static/app.js"></script>
</body>
</html>
